<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestãoPro — Auditoria</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="app-shell" data-page="auditoria" data-title="Auditoria"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/ui.js"></script>  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    if (!Auth.requireAuth()) {} else { Layout.init(); init(); }
    function init() {
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="page-header">
          <div>
            <h1 data-i18n="audit.title">Auditoria</h1>
            <p style="color:var(--color-muted);font-size:13px" data-i18n="audit.subtitle">Registro de atividades do sistema</p>
          </div>
        </div>
        <div class="card">
          <div class="filter-bar">
            <div class="search-input-wrap">
              <span class="search-icon">🔍</span>
              <input class="form-control" type="search" placeholder="Filtrar logs...">
            </div>
            <select class="form-control" style="max-width:160px">
              <option>Todas as ações</option>
              <option>CREATE</option><option>UPDATE</option><option>DELETE</option><option>LOGIN</option>
            </select>
            <input type="date" class="form-control" style="max-width:160px">
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Data/Hora</th>
                <th>Usuário</th>
                <th>Ação</th>
                <th>Entidade</th>
                <th>Detalhes</th>
                <th>IP</th>
              </tr></thead>
              <tbody id="table-body"><tr><td colspan="6"><div class="empty-state"><div class="spinner"></div></div></td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>`;
      I18N.applyAll();
      load();
    }
    async function load() {
      const body = document.getElementById('table-body');
      try {
        const data = await Auth.fetchWithAuth('/api/v1/audit?page=1&limit=20');
        if (!data.items?.length) {
          body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">🔍</div><p>${I18N.t('messages.no_results')}</p></div></td></tr>`;
          return;
        }
        const actionColors = { CREATE:'badge-success', UPDATE:'badge-info', DELETE:'badge-danger', LOGIN:'badge-gray' };
        body.innerHTML = data.items.map(log => `
          <tr>
            <td style="white-space:nowrap;font-size:12px">${I18N.formatDate(log.created_at)} ${new Date(log.created_at).toLocaleTimeString(I18N.getLang(),{hour:'2-digit',minute:'2-digit'})}</td>
            <td>${esc(log.user_name || log.user_id || '—')}</td>
            <td><span class="badge ${actionColors[log.action]||'badge-gray'}">${esc(log.action||'—')}</span></td>
            <td><code style="font-size:12px">${esc(log.entity||'—')}</code></td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(JSON.stringify(log.details||{}))}">
              ${esc(log.description || JSON.stringify(log.details||{}).substring(0,60))}
            </td>
            <td style="font-size:12px;color:var(--color-muted)">${esc(log.ip_address||'—')}</td>
          </tr>`).join('');
      } catch (e) {
        body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><p>${I18N.t('messages.error_generic')}</p></div></td></tr>`;
      }
    }
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
